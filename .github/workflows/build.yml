# Checks every pull request and every push to main. When a version tag (for example v0.1.0)
# is pushed, it publishes a GitHub release, then uploads the same build to CurseForge.
#
# The release holds the addon zip and release.json. release.json names the zip as the
# Forever build, which is how `instawow install github:weslo/revenge` finds it.
# Actions are pinned to commits; the comment beside each gives its version.
name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    name: Static checks and offline tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: luacheck
        uses: lunarmodules/luacheck@cc089e3f65acdd1ef8716cc73a3eca24a6b845e4 # v1.2.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Lua 5.1 syntax scan
        run: python -I tools/check_lua51.py

      - name: Offline tests (Lua 5.1 through lupa)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --quiet lupa==2.8
          .venv/bin/python -I tests/run.py

      - name: Package checker tests
        run: python -I -m unittest discover -s tools -p "test_*.py"

  package:
    name: Build the package
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the packager reads the version from the tags

      # On a branch push, the packager skips a commit that already has a tag ("Found future
      # tag ..., not packaging"), because the tag's own run builds it. Skip the check then too.
      - name: See whether a tag's run builds this commit
        id: tagged
        run: |
          tag=$(git tag --points-at HEAD)
          if [[ $GITHUB_EVENT_NAME == push && $GITHUB_REF == refs/heads/* && -n $tag ]]; then
            echo "This commit is tagged $tag, so that tag's run builds and checks the package."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package without uploading
        if: steps.tagged.outputs.skip != 'true'
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: -d
          pandoc: false

      - name: Check the package
        if: steps.tagged.outputs.skip != 'true'
        run: python3 -I tools/check_package.py .release

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write # to create the release and upload its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Package and upload to GitHub
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          pandoc: false
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Check what was published
        run: python3 -I tools/check_package.py --release-json .release

      # CurseForge gets a step of its own, after the GitHub release, because the packager
      # stops every other upload when CurseForge's fails. The project is the
      # X-Curse-Project-ID in RevengeTracker.toc. Until the owner stores the CF_API_TOKEN
      # secret, the packager skips the upload and this step only rebuilds the zip.
      - name: Package and upload to CurseForge
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          pandoc: false
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
